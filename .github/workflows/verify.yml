name: verify

# Source/tool/data checks; runtime.yml runs every Godot suite with log checking.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Retain exact public source for reproducing this verification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-source-snapshot"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-source-snapshot/commit.txt"
          # Only tracked implementation, tests, and definitions; no games/, Git
          # credentials, private workspaces, runtime logs, or recovered media.
          git archive --format=tar.gz --output="$RUNNER_TEMP/recovery-source-snapshot/source.tar.gz" \
            HEAD .github docs port scripts tests tools work README.md .gitignore .gitattributes
          (cd "$RUNNER_TEMP/recovery-source-snapshot" && sha256sum source.tar.gz > source.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-source-snapshot/
          retention-days: 3
          if-no-files-found: error

      - name: Analysis tools parse and CLI help needs no optional dependencies
        run: |
          set -euo pipefail
          for t in tools/macho_slice.py tools/il2cpp_triage.py tools/unity_defs_to_gdscript.py \
                   tools/dump_definitions.py tools/game_defs_to_gdscript.py \
                   tools/extract_assets.py tools/build_tracks.py tools/tracks_to_gdscript.py \
                   tools/recover_content.py tools/content_batches.py tools/content_checkpoints.py; do
            python3 -m py_compile "$t"
            python3 "$t" --help > /dev/null
          done
          for script in tools/*.sh; do bash -n "$script"; done

      - name: Source-gated content converter regressions (authored fixtures only)
        run: python3 -m unittest tests.test_content_pipeline tests.test_content_integrity tests.test_content_batches tests.test_content_continuation tests.test_content_objects tests.test_content_numeric tests.test_content_textures tests.test_font_atlas_evidence -v

      - name: Generator helpers do not import UnityPy or drift in formatting
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ud2g", "tools/unity_defs_to_gdscript.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert not hasattr(module, "UnityPy"), "UnityPy must remain a lazy dependency"
          assert module.snake("_driftBoostLevelsTable") == "drift_boost_levels_table"
          assert module.gdscript_float(0.5199999809265137) == module.gdscript_float(0.52)
          assert module.gdscript_float(3.0) == "3.0"
          PY

      - name: All recovered data reproduces byte-identically
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp -r port/scripts/data "$work/before"
          python3 tools/game_defs_to_gdscript.py work/assets/definitions/definitions.json
          python3 tools/tracks_to_gdscript.py work/assets/tracks.json port/scripts/data/tracks.gd
          for file in game_db.gd handling.gd tracks.gd catalog.gd pickups.gd modes.gd misc.gd; do
            cmp "$work/before/$file" "port/scripts/data/$file"
            echo "$file reproduces byte-identically"
          done
