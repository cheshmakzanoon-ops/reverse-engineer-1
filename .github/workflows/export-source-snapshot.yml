name: export-source-snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-source-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Build source-only snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --prefix=reverse-engineer-1/ HEAD > "$RUNNER_TEMP/export/reverse-engineer-1-source.tar.gz"
          sha256sum "$RUNNER_TEMP/export/reverse-engineer-1-source.tar.gz" > "$RUNNER_TEMP/export/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-engineer-1-source-${{ github.sha }}
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
