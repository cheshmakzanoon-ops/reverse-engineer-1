name: export-source-snapshot-parts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-source-snapshot-parts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Build and split source snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --prefix=reverse-engineer-1/ HEAD > "$RUNNER_TEMP/export/reverse-engineer-1-source.tar.gz"
          sha256sum "$RUNNER_TEMP/export/reverse-engineer-1-source.tar.gz" > "$RUNNER_TEMP/export/WHOLE_SHA256SUMS"
          split -b 180M -d -a 2 "$RUNNER_TEMP/export/reverse-engineer-1-source.tar.gz" "$RUNNER_TEMP/export/part-"
          sha256sum "$RUNNER_TEMP/export"/part-* > "$RUNNER_TEMP/export/PART_SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-00-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-00
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-01-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-01
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-02-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-02
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-03-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-03
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-04-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-04
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-05-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-05
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-part-06-${{ github.sha }}
          path: |
            ${{ runner.temp }}/export/part-06
            ${{ runner.temp }}/export/WHOLE_SHA256SUMS
            ${{ runner.temp }}/export/PART_SHA256SUMS
          retention-days: 1
          compression-level: 0
