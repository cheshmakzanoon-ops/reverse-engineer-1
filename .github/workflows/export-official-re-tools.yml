name: export-official-re-tools

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-official-re-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download and verify official tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/re-tools"
          cd "$RUNNER_TEMP/re-tools"
          curl -fL --retry 5 --retry-all-errors -o AssetRipper_linux_x64.tar.xz \
            https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_linux_x64.tar.xz
          echo '6f5d4352d36795b944243eb3ec790ec37dbca6d6756e52605bc8616e042d384e  AssetRipper_linux_x64.tar.xz' | sha256sum -c -
          curl -fL --retry 5 --retry-all-errors -o ILSpy_linux-x64_11.1.0.9782.zip \
            https://github.com/icsharpcode/ILSpy/releases/download/v11.1/ILSpy_linux-x64_11.1.0.9782.zip
          echo '96f8b38cdf901b0546b258e38be3a0a65cb7cdb98e62bdd9c48088c4dce9321b  ILSpy_linux-x64_11.1.0.9782.zip' | sha256sum -c -
          curl -fL --retry 5 --retry-all-errors -o ghidra_12.1.4_PUBLIC_20260921.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra_12.1.4_PUBLIC_20260921.zip' | sha256sum -c -
          sha256sum * > SHA256SUMS
      - name: Upload AssetRipper
        uses: actions/upload-artifact@v4
        with:
          name: AssetRipper-linux-x64-2.0.0
          path: ${{ runner.temp }}/re-tools/AssetRipper_linux_x64.tar.xz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload ILSpy
        uses: actions/upload-artifact@v4
        with:
          name: ILSpy-linux-x64-11.1
          path: ${{ runner.temp }}/re-tools/ILSpy_linux-x64_11.1.0.9782.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload Ghidra
        uses: actions/upload-artifact@v4
        with:
          name: Ghidra-12.1.4
          path: ${{ runner.temp }}/re-tools/ghidra_12.1.4_PUBLIC_20260921.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
